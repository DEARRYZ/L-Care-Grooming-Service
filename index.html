<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet"><title>ระบบL Care Glooming</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf6ee;--card:#fff;--tx:#3a2e2a;--mu:#85776f;--pr:#e07a3f;--bd:#ead9c8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231c19;--card:#322823;--tx:#f3e9e1;--mu:#b5a59a;--pr:#f08a4b;--bd:#4a3c34}}
:root[data-theme="dark"]{--bg:#231c19;--card:#322823;--tx:#f3e9e1;--mu:#b5a59a;--pr:#f08a4b;--bd:#4a3c34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;font-size:16px;line-height:1.65;letter-spacing:.1px;-webkit-font-smoothing:antialiased}h3,h4{font-weight:700;margin:.6em 0 .4em}.card,.st,.fl{box-shadow:0 1px 4px #5a3b1f14}input,select,textarea{line-height:1.5}label{font-weight:500}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--pr);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:1000px;margin:0 auto;padding:16px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}header button{background:#fff;color:var(--pr)}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:30px}
.big{padding:40px 20px;font-size:22px;border-radius:18px;text-align:center;line-height:1.5}.big small{display:block;font-size:14px;opacity:.9}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:14px;color:var(--mu)}input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin-top:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pet{display:flex;gap:12px;align-items:center;cursor:pointer}
.pet img,.ph{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--bd)}.mu{color:var(--mu);font-size:14px}
.det{margin-top:10px;border-top:1px dashed var(--bd);padding-top:10px}.det img.big2{max-width:200px;border-radius:12px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
.tot{font-size:22px;color:var(--pr);font-weight:bold}.hide{display:none!important}
#vb{width:34px;height:34px;border-radius:50%;padding:0;font-weight:bold}
#md{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#md>div{background:var(--card);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:80vh;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;border-left:5px solid var(--pr)}.st b{display:block;font-size:24px;color:var(--pr)}.st span{font-size:13px;color:var(--mu)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.pg .card{margin:0;transition:box-shadow .15s}.pg .card:hover{box-shadow:0 4px 14px #0002}.pg .full{grid-column:1/-1}
.bd{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--pr);color:#fff;margin-right:4px}.bd.o{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.no{font-size:13px;font-weight:bold;color:var(--pr);background:#e07a3f22;padding:2px 8px;border-radius:8px}
table th{background:#e07a3f22;position:sticky;top:0;white-space:nowrap}table tr:nth-child(even) td{background:#e07a3f0d}table tr:hover td{background:#e07a3f1f}
.fl{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.rc{font-size:13px;color:#1a1a1a;background:#fff;max-width:760px;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rt{display:flex;justify-content:space-between;align-items:center;padding:18px 8px}.rt h1{margin:0;font-size:46px;color:#1e4a8a;letter-spacing:2px}.lg{width:90px;height:75px;border:1px solid #aaa;display:flex;align-items:center;justify-content:center;text-align:center}
.bar{background:#1e4a8a;color:#fff;padding:3px 10px;font-size:17px}.rg{display:grid;grid-template-columns:90px 1fr 130px 1fr;gap:3px 8px;margin:6px 0 16px}.rtb{width:100%;border-collapse:collapse;border-top:1px solid #bbb}.rtb th,.rtb td{padding:5px 6px;border-bottom:1px solid #ddd}.ra{margin-left:auto;width:55%;text-align:right}.ra div{display:flex;justify-content:space-between;padding:2px 0}.fb{height:12px;background:#1e4a8a;margin-top:30px}
button.dg{background:#c0392b}.act{display:flex;gap:6px;flex-wrap:wrap}.sm{padding:5px 9px;font-size:13px}#pa{display:none}
footer{text-align:center;padding:18px 16px 60px;font-size:13px;color:var(--mu)}
#vf{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--pr);color:#fff;font-size:12px;padding:3px 10px;border-radius:99px;box-shadow:0 1px 4px #0003;cursor:pointer}
@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff}
.mc{border:2px solid #e07a3f;border-radius:14px;padding:14px;margin:0 0 14px;width:100%;page-break-inside:avoid;display:flex;gap:14px}.mc img{width:110px;height:110px;object-fit:cover;border-radius:10px}
#pa table{font-size:11px}#pa img.t{width:36px;height:36px;object-fit:cover;border-radius:50%}}
</style></head><body>
<header><button id="back" class="hide" onclick="go('home')">← กลับเมนูหลัก</button><h1>🐾 L Care Glooming</h1><span id="cs" style="font-size:13px"></span><button id="vb" onclick="showVer()" title="ประวัติการอัปเดต">!</button></header><div id="md" class="hide" onclick="if(event.target===this)this.classList.add('hide')"></div>
<main id="app"></main><footer>© 2026 All rights reserved by L Care Glooming</footer><div id="vf" onclick="showVer()" title="ประวัติการอัปเดต"></div><div id="pa"></div>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.2.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.2.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.2.0/firebase-analytics-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
let DB={pets:[],svc:[],next:1};
try{const d=localStorage.getItem('petshop');if(d)DB=JSON.parse(d)}catch(e){}
/* ---------- Firebase (Firestore) + ซิงค์อัตโนมัติ ---------- */
const firebaseConfig={apiKey:"AIzaSyDDeHgsnw6HZ2cTX211RNVnrGOPzbMkosw",authDomain:"l-care-grooming.firebaseapp.com",projectId:"l-care-grooming",storageBucket:"l-care-grooming.firebasestorage.app",messagingSenderId:"539287265670",appId:"1:539287265670:web:b7cebf45e9cbcb35dccc07",measurementId:"G-CSW2DSW6WQ"};
DB.tomb=DB.tomb||{};DB.pend=DB.pend||{}; /* tomb = บันทึกการลบ, pend = รายการที่ยังไม่ขึ้นคลาวด์ (เก็บในเครื่อง) */
let fs=null,ready=false,connecting=false,listening=false,syncErr=false,pushT=null;
const M='⚠️ ซิงค์ไม่สำเร็จ (ข้อมูลเก็บบนเครื่อง)';
const setCS=t=>{const e=document.getElementById('cs');if(e)e.textContent=t};
const status=()=>{const n=Object.keys(DB.pend).length;if(!fs)return setCS(M);if(connecting)return setCS('☁️ กำลังเชื่อมต่อ...');if(!ready)return setCS(M);
 if(!n)return setCS('☁️ ซิงค์แล้ว');setCS(syncErr||!navigator.onLine?M+' · ค้าง '+n+' รายการ':'☁️ กำลังซิงค์... ('+n+' รายการ)')};
const saveLocal=()=>{try{localStorage.setItem('petshop',JSON.stringify(DB))}catch(e){alert('พื้นที่จัดเก็บเต็ม กรุณาส่งออกข้อมูลแล้วลบรูปบางส่วน')}};
const save=()=>{saveLocal();status();if(ready){clearTimeout(pushT);pushT=setTimeout(flush,300)}};
const mark=(k,o)=>{if(o)o._u=Date.now();DB.pend[k]=1};
const findItem=k=>{const id=k.slice(2);return k[0]==='p'?DB.pets.find(x=>x.no===id):DB.svc.find(x=>String(x.id)===id)};
function flush(){if(!fs||!ready)return;const keys=Object.keys(DB.pend);if(!keys.length||!navigator.onLine){status();return}
 const ops=[],sent=[];
 keys.forEach(k=>{if(k==='n'){ops.push(b=>b.set(fs.doc('meta/counter'),{next:DB.next}));sent.push([k,0]);return}
  const it=findItem(k),ref=fs.collection(k[0]==='p'?'pets':'svc').doc(k.slice(2));let ts;
  if(it){it._u=it._u||Date.now();ts=it._u;const o=JSON.parse(JSON.stringify(it));ops.push(b=>b.set(ref,o))}
  else{ts=DB.tomb[k]=DB.tomb[k]||Date.now();ops.push(b=>b.set(ref,{_del:true,_u:ts}))}
  sent.push([k,ts])});
 const ch=[];for(let i=0;i<ops.length;i+=400)ch.push(ops.slice(i,i+400));
 Promise.all(ch.map(c=>{const b=fs.batch();c.forEach(f=>f(b));return b.commit()})).then(()=>{
  sent.forEach(([k,ts])=>{if(k==='n'){delete DB.pend.n;return}const it=findItem(k);if((it?it._u:DB.tomb[k])===ts)delete DB.pend[k]});
  syncErr=false;saveLocal();status()}).catch(e=>{console.error(e);syncErr=true;status()})}
/* รวมข้อมูลจากคลาวด์: ฉบับที่แก้ไขล่าสุด (_u) ชนะ / รายการที่ยังค้างส่งและใหม่กว่าจะไม่ถูกทับ */
function applyRemote(kind,id,d,removed){const k=kind+':'+id,arr=kind==='p'?'pets':'svc',i=DB[arr].findIndex(x=>String(kind==='p'?x.no:x.id)===id),L=i<0?(DB.tomb[k]||0):(DB[arr][i]._u||0);
 if(removed){if(!DB.pend[k]&&i>=0)DB[arr].splice(i,1);return}
 if(DB.pend[k]&&L>=(d._u||0))return;
 if(d._del){if(i>=0)DB[arr].splice(i,1);DB.tomb[k]=d._u||Date.now();delete DB.pend[k];return}
 delete DB.tomb[k];delete DB.pend[k];i<0?DB[arr].push(d):DB[arr][i]=d}
function afterCloud(){DB.pets.sort((a,b)=>a.no<b.no?-1:1);saveLocal();
 if(view==='home')render();else if(tab==='b'&&view==='mem'&&$('#L'))listPets();else if(tab==='b'&&view==='svc'&&$('#SL'))listSvc();status()}
function connect(){if(!fs||connecting||ready)return;connecting=true;status();
 Promise.all([fs.collection('pets').get(),fs.collection('svc').get(),fs.doc('meta/counter').get()]).then(([ps,ss,mc])=>{
  const have={p:new Set(),s:new Set()};
  ps.forEach(d=>{have.p.add(d.id);applyRemote('p',d.id,d.data())});ss.forEach(d=>{have.s.add(d.id);applyRemote('s',d.id,d.data())});
  DB.pets.forEach(p=>{if(!have.p.has(p.no)&&!DB.pend['p:'+p.no]){p._u=p._u||Date.now();DB.pend['p:'+p.no]=1}});
  DB.svc.forEach(x=>{if(!have.s.has(String(x.id))&&!DB.pend['s:'+x.id]){x._u=x._u||Date.now();DB.pend['s:'+x.id]=1}});
  const cn=mc.exists?mc.data().next:1;DB.next=Math.max(DB.next||1,cn,...DB.pets.map(p=>+p.no+1));if(cn<DB.next)DB.pend.n=1;
  connecting=false;ready=true;syncErr=false;afterCloud();flush();
  if(!listening){listening=true;
   [['p','pets'],['s','svc']].forEach(([kd,col])=>fs.collection(col).onSnapshot(q=>{q.docChanges().forEach(c=>applyRemote(kd,c.doc.id,c.doc.data(),c.type==='removed'));afterCloud()},e=>console.error(e)));
   fs.doc('meta/counter').onSnapshot(d=>{if(d.exists&&d.data().next>DB.next){DB.next=d.data().next;saveLocal()}},e=>console.error(e))}
 }).catch(e=>{console.error(e);connecting=false;status()})}
function initCloud(){
 try{if(typeof firebase==='undefined')throw 0;firebase.initializeApp(firebaseConfig);try{firebase.analytics()}catch(e){}fs=firebase.firestore()}catch(e){status();return}
 connect();
 addEventListener('online',()=>{connect();flush()});addEventListener('offline',status);
 setInterval(()=>{if(!ready)connect();else if(Object.keys(DB.pend).length)flush()},20000)}
const pad=n=>String(n).padStart(5,'0'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?new Date(d).toLocaleDateString('th-TH'):'-',money=n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const typeOf=p=>p.type==='อื่นๆ'&&p.typeNote?'อื่นๆ ('+p.typeNote+')':p.type;
const svcList=['อาบน้ำ','ตัดขน','อาบน้ำ+ตัดขน','ตัดเล็บ','เช็ดหู','แปรงฟัน','อื่นๆ'];
let view='home',tab='a',photo='',open_=null,editNo=null,pendF=null;
const VER='1.0.7',HIST=[{v:'1.0.7',d:'2026-10-03',n:['แสดงเลขเวอร์ชันที่มุมขวาล่างของหน้าเว็บ (กดเพื่อดูประวัติการอัปเดต)','เพิ่มข้อความท้ายหน้า: All rights reserved by L Care Glooming']},{v:'1.0.6',d:'2026-10-03',n:['ซิงค์อัตโนมัติเมื่อกลับมาออนไลน์ และลองเชื่อมต่อใหม่ทุก 20 วินาที','จดรายการที่ยังไม่ขึ้นคลาวด์ไว้ในเครื่อง ปิดหน้าเว็บแล้วเปิดใหม่ก็ยังส่งต่อให้ครบ (เพิ่ม/แก้ไข/ลบ)','บันทึกเวลาแก้ไขล่าสุดของแต่ละรายการ หลายเครื่องแก้พร้อมกันให้ฉบับที่ใหม่กว่าชนะ','แสดงจำนวนรายการที่ค้างซิงค์ที่แถบหัวเว็บ']},{v:'1.0.5',d:'2026-10-03',n:['ปรับข้อความสถานะการซิงค์: เมื่อเชื่อมต่อ Firebase ไม่ได้ แสดง "ซิงค์ไม่สำเร็จ (ข้อมูลเก็บบนเครื่อง)"']},{v:'1.0.4',d:'2026-10-03',n:['รองรับ Firebase SDK (Firestore) ซิงค์สมาชิกและบิลข้ามเครื่อง พร้อมเก็บสำรองในเครื่อง','ฟอร์มบันทึกบริการ: ลบรายการบริการที่ไม่ต้องการกรอกได้ (ปุ่ม ✕)']},{v:'1.0.3',d:'2026-10-03',n:['แดชบอร์ดการชำระเงิน: แก้ไขบิลรายรายการได้ (วันที่ พนักงาน บริการ/ราคา ส่วนลด หมายเหตุ)','ลบบิลได้ โดยมีหน้าต่างยืนยันก่อนลบทุกครั้ง']},{v:'1.0.2',d:'2026-10-02',n:['เพิ่มปุ่มออกใบเสร็จรับเงิน PDF รายบิล ในแดชบอร์ดการชำระเงิน','ปรับฟอนต์ทั้งระบบให้อ่านสบายตาขึ้น','เพิ่มตัวกรองช่วงวันที่ในทั้งสองแดชบอร์ด']},{v:'1.0.1',d:'2026-10-02',n:['เปลี่ยนชื่อร้านเป็น L Care Glooming','รวมประเภทบริการและราคาในแถวเดียว (เลือกจากรายการ + ราคา สูงสุด 5 รายการ)','ปรับแดชบอร์ดทั้งสองส่วนให้สวยงามและดูง่ายขึ้น มีสรุปตัวเลข','แก้ไขประวัติสัตว์ได้ (ยกเว้นเลขสมาชิก)','เพิ่มปุ่มดูประวัติบริการเฉพาะสมาชิกรายนั้น','เพิ่มปุ่ม "!" ดูประวัติการอัปเดต']},{v:'1.0.0',d:'2026-10-02',n:['เปิดใช้งานระบบครั้งแรก: ประวัติสัตว์ ประวัติให้บริการ ส่งออก PDF/CSV']}];
function showVer(){const m=$('#md');m.innerHTML=`<div><h3 style="margin-top:0">ประวัติการอัปเดต <span class="no">เวอร์ชันปัจจุบัน ${VER}</span></h3>${HIST.map(h=>`<p><b>v${h.v}</b> <span class="mu">${fd(h.d)}</span></p><ul>${h.n.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}<button onclick="$('#md').classList.add('hide')">ปิด</button></div>`;m.classList.remove('hide')}

function go(v,t,k){editNo=k||null;view=v;tab=t||'a';render()}
const editPet=no=>go('mem','a',no),viewSvc=no=>{pendF=no;go('svc','b')};
function render(){
 $('#back').classList.toggle('hide',view==='home');
 const a=$('#app');
 if(view==='home'){a.innerHTML=`<div class="home"><button class="big" onclick="go('mem')">🐶 ประวัติสัตว์<small>สมาชิก / สร้างประวัติ / แดชบอร์ด</small></button><button class="big" onclick="go('svc')">✂️ ประวัติให้บริการ<small>บันทึกบิล / แดชบอร์ดการชำระเงิน</small></button></div>
 <p class="mu" style="text-align:center;margin-top:24px">ข้อมูลทั้งหมดเก็บไว้ในเบราว์เซอร์เครื่องนี้ · สมาชิกทั้งหมด ${DB.pets.length} ราย</p>`;return}
 const T=view==='mem'?[['a','สร้างประวัติสัตว์ใหม่'],['b','แดชบอร์ดสมาชิก']]:[['a','บันทึกการให้บริการ'],['b','แดชบอร์ดการชำระเงิน']];
 a.innerHTML=`<div class="tabs">${T.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="editNo=null;tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div id="c"></div>`;
 ({mem:{a:formMem,b:dashMem},svc:{a:formSvc,b:dashSvc}})[view][tab]();
}
/* ---------- สร้างประวัติ ---------- */
function formMem(){const p=editNo?DB.pets.find(x=>x.no===editNo):null,e=!!p,q=p||{};photo=q.photo||'';const v=k=>esc(q[k]||''),op=(L,x)=>L.map(o=>`<option ${o===x?'selected':''}>${o}</option>`).join('');

<label>ชื่อสัตว์ *<input id="n" value="${v('name')}"></label><label>อายุ<input id="ag" placeholder="เช่น 2 ปี" value="${v('age')}"></label>

 $('#md').innerHTML=`<div><h3 style="margin-top:0">🗑️ ยืนยันการลบบิล</h3><p>คุณต้องการลบบิลนี้ใช่หรือไม่?</p><div class="card" style="margin-bottom:10px"><span class="no">${rcNo(s)}</span> · ${fd(s.date)}<br>สมาชิก #${s.no} ${esc(p.name)}<br>${esc(svcName(s))}<br><b>ยอดสุทธิ ${money(s.total)} บาท</b></div><p class="mu">เมื่อลบแล้วไม่สามารถกู้คืนได้</p>
 <div class="row"><button class="dg" onclick="doDel(${id})">ลบบิล</button><button class="g" onclick="mClose()">ยกเลิก</button></div></div>`;$('#md').classList.remove('hide')}
function doDel(id){DB.svc=DB.svc.filter(x=>x.id!==id);DB.tomb['s:'+id]=Date.now();DB.pend['s:'+id]=1;save();mClose();listSvc()}
function rcNo(s){const m=s.date.slice(0,7);return 'RE'+m.slice(2,4)+m.slice(5,7)+String(DB.svc.filter(x=>x.date.slice(0,7)===m&&x.id<=s.id).length).padStart(3,'0')}
function bahtText(n){const d=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],u=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
 const rd=t=>{let r='',l=t.length;for(let i=0;i<l;i++){const x=+t[i],p=l-i-1;if(!x)continue;if(p===1&&x===1);else if(p===1&&x===2)r+='ยี่';else if(p===0&&x===1&&l>1&&+t[l-2]>0)r+='เอ็ด';else r+=d[x];r+=u[p]}return r};
 const cv=t=>t.length>6?cv(t.slice(0,-6))+'ล้าน'+rd(t.slice(-6)):rd(t);const b=Math.floor(n+1e-9),st=Math.round((n-b)*100);
 return (b?cv(String(b)):'ศูนย์')+'บาท'+(st?cv(String(st))+'สตางค์':'ถ้วน')}
function receipt(s){const p=petOf(s.no);return `<div class="rc"><div class="rt"><h1>RECEIPT</h1><div class="lg">L Care<br>Glooming</div></div><div class="bar">ใบเสร็จรับเงิน</div>
<div style="margin:12px 4px"><b style="font-size:15px">ข้อมูลลูกค้า</b><div class="rg"><div>ชื่อลูกค้า</div><div>${esc(p.owner)}</div><div>เลขที่ใบเสร็จรับเงิน</div><div>${rcNo(s)}</div>
<div>เบอร์โทรศัพท์</div><div>${esc(p.phone)||'-'}</div><div>เลขที่อ้างอิง</div><div>สมาชิก #${s.no}</div>
<div>สัตว์เลี้ยง</div><div>${esc(p.name)}${p.type?' ('+esc(typeOf(p))+')':''}</div><div>วันที่ชำระเงิน</div><div>${fd(s.date)}</div>
<div>พนักงาน</div><div>${esc(s.staff)}</div><div></div><div></div></div>
<div style="min-height:230px"><table class="rtb"><tr><th>ลำดับ</th><th>รายการสินค้า/บริการ</th><th style="text-align:right">จำนวน</th><th style="text-align:right">ราคา/หน่วย</th><th style="text-align:right">ราคารวม</th></tr>
${s.items.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(lbl(i))}</td><td style="text-align:right">1</td><td style="text-align:right">${money(i.a)}</td><td style="text-align:right">${money(i.a)}</td></tr>`).join('')}</table></div>
<div style="border-top:1px solid #bbb;padding-top:8px"><div class="ra"><div><b>รวมเป็นเงิน</b><b>${money(s.sub)}</b></div><div><b>ส่วนลด${s.dtype==='%'?' ('+s.disc+'%)':''}</b><b>${money(s.dv)}</b></div></div></div>
<div style="border-top:1px solid #bbb;border-bottom:1px solid #bbb;margin-top:8px;padding:8px 0;text-align:right"><span style="font-size:17px;font-weight:bold">รวมเป็นเงินทั้งสิ้น &nbsp; ${money(s.total)}</span><br>(${bahtText(s.total)})</div>
${s.remark?`<p>หมายเหตุ: ${esc(s.remark)}</p>`:''}
<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px"><div><b>L Care Glooming</b></div><div style="text-align:center;width:230px"><div style="border-top:1px solid #444;padding-top:4px">ผู้จัดการร้าน</div></div></div></div><div class="fb"></div></div>`}

function expPdf(k,no){const A=$('#pa');
 const card=p=>`<div class="mc">${p.photo?`<img src="${p.photo}">`:''}<div><h2 style="margin:0 0 6px">บัตรสมาชิก #${p.no}</h2>${detail(p)}</div></div>`;
 if(k==='rc')A.innerHTML=receipt(DB.svc.find(x=>x.id===no));else if(k==='card')A.innerHTML=card(DB.pets.find(p=>p.no===no));
 else if(k==='pets')A.innerHTML=`<h2>รายชื่อสมาชิก (${filtPets().length} ราย)</h2>`+filtPets().map(card).join('');
 else A.innerHTML=`<h2>รายงานการชำระเงิน</h2>`+svcTable(filtSvc(),true)+`<p><b>รวมทั้งหมด: ${money(filtSvc().reduce((a,s)=>a+s.total,0))} บาท</b></p>`;
 setTimeout(()=>{try{window.print()}catch(e){alert('เบราว์เซอร์นี้ไม่รองรับการพิมพ์ในหน้านี้ กรุณาเปิดลิงก์ในแท็บใหม่')}},150)}
async function expCsv(k){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let h,r;
 if(k==='pets'){h=['เลขสมาชิก','วันเริ่มสมาชิก','ชื่อสัตว์','อายุ','ประเภท','สายพันธุ์','เพศ','วันเกิด','สี/ลักษณะ','เจ้าของ','เบอร์โทร','แพ้อาหาร','หมายเหตุ','รูป(base64)'];r=filtPets().map(p=>[p.no,p.start,p.name,p.age,typeOf(p),p.breed,p.sex,p.dob,p.color,p.owner,p.phone,p.allergy,p.remark,p.photo])}
 else{h=['วันที่','เลขสมาชิก','ชื่อสัตว์','เจ้าของ','บริการ','พนักงาน','รายการ','ยอดรวม','ส่วนลด','ส่วนลดเป็นเงิน','ยอดสุทธิ','หมายเหตุ','รูปสัตว์(base64)'];r=filtSvc().map(s=>{const p=petOf(s.no);return[s.date,s.no,p.name,p.owner,svcName(s),s.staff,s.items.map(i=>lbl(i)+':'+i.a).join(' | '),s.sub,s.dtype==='%'?s.disc+'%':s.disc,s.dv,s.total,s.remark,p.photo]})}
 const csv='\ufeff'+[h,...r].map(x=>x.map(q).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),fn=(k==='pets'?'members':'payments')+'.csv';
 try{const d=await claude.use('downloads');if(d){await d.save({filename:fn,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click()}
